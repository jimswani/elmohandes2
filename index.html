<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:6px 4px;border-bottom:1px solid var(--line)}
.brand img{width:min(260px,70%);height:auto;display:block;mix-blend-mode:lighten}
.brand .sub{text-align:center}
.btn{box-shadow:0 2px 0 #7A1015}
.pill.now{background:var(--accent)}
.slot{color:var(--accent)}
.tabs button[aria-selected="true"]{box-shadow:0 2px 0 #7A1015}
.search input{width:100%;padding:12px 14px;font-size:1rem;border-radius:12px}
.addstu{display:grid;grid-template-columns:1fr 1fr;gap:8px}.addstu input:first-child{grid-column:1/-1}.addstu .btn{grid-column:1/-1}
.linkish{background:none;border:0;padding:0;text-align:right;color:inherit;cursor:pointer;min-width:0;flex:1}
.pill.okp{background:var(--ok-soft);color:var(--ok)}
.pill.warnp{background:var(--bad-soft);color:var(--bad)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:4px;border-bottom:1px solid var(--line)}
.phone{color:var(--accent);font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.stats.two{grid-template-columns:repeat(2,1fr)}
.months{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.mchip.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
details.pick summary{cursor:pointer;list-style:none}details.pick summary::-webkit-details-marker{display:none}
.selbox{width:20px;height:20px;accent-color:var(--accent);flex:none}
.selbar select{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.feeform{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.feeform input{width:100px}
.top .btn.ghost{flex:none;padding:7px 12px}
.form.danger{border-color:var(--bad)}.delbtn{background:var(--bad)}
.undo{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:8px 10px 8px 16px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:.9rem}
.undo button{border:0;background:var(--accent);color:#fff;border-radius:99px;padding:6px 14px;font-weight:700}
.unpaidbtn{border-color:var(--accent)}
.closebox{display:flex;flex-direction:column;gap:8px;padding-block:8px;border-block:1px dashed var(--line)}
.okrow{color:var(--ok);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lockrow{color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rcpt{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-size:.8rem;color:var(--muted)}
button.wa{border:0;font-family:inherit;cursor:pointer}
.wa{display:inline-flex;align-items:center;border-radius:9px;padding:6px 12px;font-weight:700;font-size:.85rem;background:#1F7A4D;color:#fff;text-decoration:none}
.wa.big{justify-content:center;padding:12px;font-size:1rem;border-radius:12px}
.btn.wa{background:#1F7A4D;color:#fff;box-shadow:0 2px 0 #0F4D30}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:31;max-width:calc(100% - 32px);background:var(--bad);color:#fff;padding:10px 16px;border-radius:14px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;max-height:100%;overflow:auto}
.sheet img{width:100%;border-radius:12px;display:block}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:4px}
.monthnav>button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.4rem;flex:none}
.monthnav .mn{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.monthnav .mn b{font-family:var(--display);font-size:1.15rem}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:.85rem;padding:0;text-decoration:underline}
.partt{color:var(--warn)}
.paid.partb{border-color:var(--warn);color:var(--warn)}
.mchip.part{background:var(--warn-soft,rgba(240,180,76,.15));border-color:var(--warn);color:var(--warn)}
.partform{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;margin-top:8px}.partform input{width:100px}
.stu{flex-wrap:wrap}
.tpl{width:100%;min-height:150px;font:inherit;line-height:1.7;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:99px;padding:4px 10px;font-size:.8rem}
.msgpv{margin:8px 0}.msgpv summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:6px 0}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.9rem;color:var(--muted)}
.subj{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.subj h2{margin:0}.subform{background:var(--bg)}
.btn.wide{width:100%}
.table-mini{display:flex;flex-direction:column;gap:6px}.tm-row{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:8px 10px}
.mglist{display:flex;flex-direction:column;gap:6px}.mg{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}.mg input{margin-top:6px;accent-color:var(--accent)}
details.backup summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
details.backup summary::-webkit-details-marker{display:none}
details.backup[open] summary{margin-bottom:8px}
.ver{font-size:.7rem;opacity:.6}
.credit{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:.78rem;padding-top:10px;border-top:1px solid var(--line)}
</style>

<title>سنتر المهندس 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, drill-down — logo band → today strip → teachers → groups → group sheet. Brand: El-Mohandes 2 — black, white, red */
:root{
  --bg:#0B0B0C; --card:#161618; --ink:#F4F4F5; --muted:#A0A0A8; --line:#2A2A2E;
  --accent:#E0262F; --accent-soft:#3A1416; --plum:#FF5A5F;
  --ok:#3FCB7E; --ok-soft:#14301F; --bad:#FF5A5F; --bad-soft:#3A1416; --warn:#F0B44C;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:1rem}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:1.2rem;flex:none}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.lbl{font-size:.75rem;letter-spacing:.02em;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;width:100%}
.row .m{flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none}
.chev{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.now{background:var(--plum);color:#fff}
.today{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.today .row{border:0;background:var(--bg);padding:10px 12px}
.slot{font-family:var(--display);font-weight:700;color:var(--plum);font-variant-numeric:tabular-nums;min-width:54px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stu{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stu .m{flex:1;min-width:0}
.tog{display:flex;gap:6px}
.tog button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-weight:600;font-size:.85rem}
.tog .p[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tog .a[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tog .paid[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tm{min-width:58px;text-align:center;font-weight:700;color:var(--accent);font-size:.9rem;line-height:1.2}
.tog button.wa{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.x{border:0;background:transparent;color:var(--bad);font-size:.85rem}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form .f{display:flex;flex-direction:column;gap:4px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:.85rem;cursor:pointer}
.days input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.days label{position:relative}
.days label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.note{font-size:.8rem;color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.hist{display:flex;gap:3px;flex-wrap:wrap}
.hist i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.hist i.p{background:var(--ok)} .hist i.a{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.row,.stu{transition:transform .12s}.row:active{transform:scale(.99)}}
</style>

const BRAND={name:"سنتر المهندس 2",short:"المهندس 2",latin:"The Engineer",accent:"#D3262F",accentSoft:"#FCE9EA",dark:"#0B0B0C",file:"elmohandes2",account:"elmohandes2@jimswani-centers.app"};
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const COLORS=["#E0262F","#3A3A40","#9E1A21","#55555C","#C2413A","#2B2B30","#7A1015"];
let S={teachers:[],attendance:{},payments:{}};
let nav={view:"home"}; // home | teacher | group | addTeacher | addGroup
let tab="pay", attDate=todayISO(), payMonth=todayISO().slice(0,7);

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(t){if(!t)return"";let[h,m]=t.split(":").map(Number);const pm=h>=12;h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+(pm?" م":" ص")}
function daysTxt(g){return g.days.map(d=>DAYS[d]).join(" و ")}
function findTeacher(id){return S.teachers.find(t=>t.id===id)}
function findGroup(gid){for(const t of S.teachers){const g=(t.groups||[]).find(g=>g.id===gid);if(g)return{t,g}}return null}

function arn(n){return Number(n||0).toLocaleString("ar-EG")}
function subjectsOf(t){if(!t)return[];if(!Array.isArray(t.subjects)||!t.subjects.length){t.subjects=[{id:"s_"+t.id,name:t.subject||"",share:t.share||{type:"pct",value:0}}]}
  const ss=t.subjects;(t.groups||[]).forEach(g=>{if(!g.subjectId||!ss.some(x=>x.id===g.subjectId))g.subjectId=ss[0].id});return ss}
function subOf(t,g){const ss=subjectsOf(t);return ss.find(x=>x.id===g.subjectId)||ss[0]}
function subNames(t){return subjectsOf(t).map(x=>x.name).filter(Boolean).join("، ")}
function shareOfSub(sub){const x=(sub&&sub.share)||{};return{type:x.type==="fixed"?"fixed":"pct",value:+x.value||0}}
function shareOf(t){return shareOfSub(subjectsOf(t)[0])}
function shareTxtS(x){if(!x.value)return "مفيش نسبة";return x.type==="fixed"?arn(x.value)+" ج على كل طالب دفع":arn(x.value)+"٪ من المحصّل"}
function lockShareSub(t,sub,m){const L=getLock(t.id,m);if(!L)return null;const x=(L.shares&&L.shares[sub.id])||(!L.shares?L.share:null);return x?{type:x.type==="fixed"?"fixed":"pct",value:+x.value||0}:null}
function effShare(t,sub,m){return (m&&lockShareSub(t,sub,m))||shareOfSub(sub)}
function shareTxt(t,m){const ss=subjectsOf(t);if(ss.length===1){const x=effShare(t,ss[0],m);return x.value?shareTxtS(x):"مفيش نسبة للسنتر"}return ss.map(x=>(x.name||"مادة")+": "+shareTxtS(effShare(t,x,m))).join(" · ")}
function cutWith(x,units,collected){const c=x.type==="fixed"?Math.round(units*x.value):Math.round(collected*x.value/100);return Math.max(0,Math.min(c,collected))}
function curMonth(){return todayISO().slice(0,7)}
function shiftMonth(d){let[y,mo]=payMonth.split("-").map(Number);mo+=d;while(mo>12){mo-=12;y++}while(mo<1){mo+=12;y--}payMonth=y+"-"+String(mo).padStart(2,"0");teacherImg=null;render()}

function isActive(s){return !s.left}
function inMonth(s,m){return (!s.left||m<s.left)&&(!s.joined||m>=s.joined)}
function activeSt(g){return (g.students||[]).filter(isActive)}
function monthSt(g,m){return (g.students||[]).filter(s=>inMonth(s,m))}
function wasBefore(g,x,m0){if(x.joined)return x.joined<m0;const pre=g.id+"|";return Object.keys(S.payments).some(k=>k.startsWith(pre)&&k.slice(pre.length)<m0&&hasPayV((S.payments[k]||{})[x.id]))}
function isPaidV(v){return v===true||typeof v==="number"}
function isPartV(v){return !!v&&typeof v==="object"&&+v.part>0}
function hasPayV(v){return isPaidV(v)||isPartV(v)}
function isPaid(g,s,m){return isPaidV((S.payments[g.id+"|"+m]||{})[s.id])}
function isPart(g,s,m){return isPartV((S.payments[g.id+"|"+m]||{})[s.id])}
function hasPay(g,s,m){return hasPayV((S.payments[g.id+"|"+m]||{})[s.id])}
function remaining(g,s,m){return isPaid(g,s,m)?0:Math.max(0,feeOf(g,s)-payAmt(g,s,m))}
function payUnits(g,s,m){if(isPaid(g,s,m))return 1;if(isPart(g,s,m)){const f=feeOf(g,s);return f>0?Math.min(1,payAmt(g,s,m)/f):0}return 0}
function payAmt(g,s,m){const v=(S.payments[g.id+"|"+m]||{})[s.id];return v===true?feeOf(g,s):typeof v==="number"?v:isPartV(v)?+v.part:0}
function setPaid(g,s,m,on){const t=teacherOf(g);if(t&&isLocked(t.id,m)){flash("شهر "+monthName(m)+" مقفول عند "+t.name+". افتحه من حساب الشهر الأول.");return false}const k=g.id+"|"+m;S.payments[k]=S.payments[k]||{};if(on)S.payments[k][s.id]=feeOf(g,s);else delete S.payments[k][s.id];return true}
function setPart(g,s,m,amt){const t=teacherOf(g);if(t&&isLocked(t.id,m)){flash("شهر "+monthName(m)+" مقفول عند "+t.name+". افتحه من حساب الشهر الأول.");return false}const k=g.id+"|"+m;S.payments[k]=S.payments[k]||{};amt=Math.max(0,+amt||0);
  if(amt<=0)delete S.payments[k][s.id];else if(amt>=feeOf(g,s))S.payments[k][s.id]=amt;else S.payments[k][s.id]={part:amt};return true}
function feeOf(g,s){return (s&&s.fee!==undefined&&s.fee!==null&&s.fee!=="")?(+s.fee||0):(+g.fee||0)}
function hasCustomFee(s){return s&&s.fee!==undefined&&s.fee!==null&&s.fee!==""}
function teacherMonth(t,m){const subs=subjectsOf(t).map(sub=>({sub,stu:0,paid:0,part:0,units:0,collected:0,center:0}));
  (t.groups||[]).forEach(g=>{const r=subs.find(q=>q.sub.id===g.subjectId)||subs[0];monthSt(g,m).forEach(x=>{r.stu++;if(isPaid(g,x,m))r.paid++;else if(isPart(g,x,m))r.part++;r.units+=payUnits(g,x,m);r.collected+=payAmt(g,x,m)})});
  subs.forEach(r=>{r.center=cutWith(effShare(t,r.sub,m),r.units,r.collected)});
  const sum=k=>subs.reduce((a,r)=>a+r[k],0),collected=sum("collected"),center=sum("center");
  return{stu:sum("stu"),paid:sum("paid"),part:sum("part"),collected,center,teacher:collected-center,subs}}

  if(!(CLOUD&&cuser))return;

var pickQ="",selMode=false,selSet=new Set(),transferMsg="";
function pickHTML(q){
  q=String(q||"").trim();if(!q)return "";
  const f=findGroup(nav.gid);if(!f)return "";
  const here=new Set(activeSt(f.g).map(personKey)),nq=normAr(q),dq=digits(q),seen=new Map();
  allEntries().forEach(e=>{if(e.g.id===f.g.id)return;const s=e.s;
    const hit=normAr(s.name).includes(nq)||(dq.length>=3&&(digits(s.mobile).includes(dq)||digits(s.phone).includes(dq)));
    const k=personKey(s);if(hit&&!seen.has(k))seen.set(k,e)});
  if(!seen.size)return '<div class="sub" style="padding-top:8px">مفيش طالب بالاسم ده.</div>';
  return '<div class="list" style="margin-top:8px">'+[...seen.entries()].slice(0,20).map(([k,e])=>{const inHere=here.has(k);

function cloneStu(s){return{id:uid(),name:s.name,mobile:s.mobile||"",phone:s.phone||"",joined:curMonth()}}
function addExisting(sid){const f=findGroup(nav.gid);const e=allEntries().find(x=>x.s.id===sid);if(!f||!e)return;
  f.g.students=f.g.students||[];if(activeSt(f.g).some(x=>personKey(x)===personKey(e.s)))return;
  f.g.students.push(cloneStu(e.s));transferMsg="اتضاف "+e.s.name;save();render();
  const el=document.getElementById("pickQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
function toggleSelect(){selMode=!selMode;selSet=new Set();transferMsg="";render()}
function toggleSel(id,v){if(v===undefined)v=!selSet.has(id);v?selSet.add(id):selSet.delete(id);render()}
function selAll(){const f=findGroup(nav.gid);const st=f?activeSt(f.g):[];selSet=selSet.size===st.length?new Set():new Set(st.map(x=>x.id));render()}
function transferSel(move){
  const f=findGroup(nav.gid),tid=(document.getElementById("selTarget")||{}).value,to=tid&&findGroup(tid);
  if(!f||!to||!selSet.size)return;
  to.g.students=to.g.students||[];const m0=curMonth();
  if(move){const lk=[f.t,to.t].find(tt=>isLocked(tt.id,m0));if(lk){transferMsg="شهر "+monthName(m0)+" مقفول عند "+lk.name+"، افتحه الأول عشان النقل بيغيّر التقفيلة.";render();return}}
  let added=0,skipped=0,money=0;const picked=activeSt(f.g).filter(x=>selSet.has(x.id));
  picked.forEach(x=>{
    let dest=activeSt(to.g).find(y=>personKey(y)===personKey(x));
    if(dest){skipped++}else{dest=cloneStu(x);to.g.students.push(dest);added++}
    if(!move)return;
    // this month and later follow the student to the new group, at the amount he actually paid
    const pre=f.g.id+"|";let history=false;
    Object.keys(S.payments).forEach(k=>{if(!k.startsWith(pre))return;const mm=k.slice(pre.length),rec=S.payments[k];if(!rec||!hasPayV(rec[x.id]))return;
      if(mm<m0){history=true;return}
      const amt=payAmt(f.g,x,mm),nk=to.g.id+"|"+mm;S.payments[nk]=S.payments[nk]||{};
      const prevAmt=hasPayV(S.payments[nk][dest.id])?payAmt(to.g,dest,mm):0,tot=prevAmt+amt,wasFull=isPaidV(rec[x.id]);S.payments[nk][dest.id]=(wasFull||tot>=feeOf(to.g,dest))?tot:{part:tot};money+=amt;delete rec[x.id]});
    // earlier months stay in the old group's closing: keep him there as "left" instead of deleting
    if(history||wasBefore(f.g,x,m0)){x.left=m0}else{f.g.students=f.g.students.filter(y=>y.id!==x.id)}
  });
  transferMsg=(move?"اتنقل ":"اتنسخ ")+arn(move?added+skipped:added)+" لـ "+to.g.name+(move&&money?" ومعاهم "+arn(money)+" ج من دفع الشهر ده":"")+(!move&&skipped?" · "+arn(skipped)+" كانوا موجودين هناك":"");
  selMode=false;selSet=new Set();save();render();
}

  // paid stamp
  ctx.save();ctx.translate(cx+170,cy+190);ctx.rotate(-0.18);ctx.strokeStyle=C.ok;ctx.lineWidth=5;{ctx.font="700 46px "+F1;const sw=Math.max(240,ctx.measureText(RM?(isPart(g,x,m)?"باقي جزء":"لسه مادفعش"):"مدفوع ✓").width+60);roundRect(ctx,-sw/2,-46,sw,92,18)}ctx.stroke();ctx.fillStyle=C.ok;ctx.textAlign="center";ctx.font="700 46px "+F1;ctx.fillText(RM?(isPart(g,x,m)?"باقي جزء":"لسه مادفعش"):isPart(g,x,m)?"دفع جزء":"مدفوع ✓",0,16);ctx.restore();
  const rows=[["الطالب",x.name],["المجموعة",g.name],["المدرس",t.name+(subOf(t,g).name?" · "+subOf(t,g).name:"")],["الشهر",monthName(m)+(RM?(isPart(g,x,m)?" · دفع "+arn(payAmt(g,x,m))+" من "+arn(feeOf(g,x))+" ج":""):isPart(g,x,m)?" · باقي "+arn(remaining(g,x,m))+" ج":"")],[RM?"التاريخ":"تاريخ الإيصال",new Date().toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"})]];
  let y=cy+170;
  rows.forEach(r=>{ctx.textAlign="right";ctx.fillStyle=C.muted;ctx.font="500 26px "+F2;ctx.fillText(r[0],W-cx-50,y);
    ctx.fillStyle=C.ink;ctx.font="600 32px "+F2;let v=String(r[1]);while(ctx.measureText(v).width>cw-420&&v.length>3)v=v.slice(0,-2)+"…";ctx.fillText(v,W-cx-50,y+44);
    ctx.fillStyle=C.line;ctx.fillRect(cx+50,y+66,cw-100,2);y+=104});
  // amount band
  const amt=RM?remaining(g,x,m):payAmt(g,x,m),by=cy+ch-150;
  ctx.fillStyle=C.okS;roundRect(ctx,cx+40,by,cw-80,110,20);ctx.fill();
  ctx.textAlign="right";ctx.fillStyle=C.ok;ctx.font="600 30px "+F2;ctx.fillText(RM?"المطلوب":"المبلغ",W-cx-80,by+66);
  ctx.textAlign="left";ctx.font="700 56px "+F1;ctx.fillText(amt.toLocaleString("ar-EG")+" جنيه",cx+80,by+75);
  ctx.textAlign="center";ctx.fillStyle=C.ink;ctx.font="700 30px "+F1;ctx.fillText(BRAND.name+" · "+BRAND.latin,W/2,H-110);
  ctx.fillStyle=C.muted;ctx.font="500 22px "+F2;ctx.fillText("شكرًا لحضرتك",W/2,H-70);
  ctx.fillStyle=C.black;ctx.fillRect(0,H-26,W,26);ctx.fillStyle=C.red;ctx.fillRect(0,H-26,W,5);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/png"));
}


/* ---------- message templates ---------- */
var TPL_DEFAULT={
  reminder:"السلام عليكم، تذكير باشتراك شهر {الشهر} للطالب {الطالب} في مجموعة {المجموعة} مع {المدرس}: {الباقي} جنيه.\n{السنتر}",
  closing:"السلام عليكم يا {المدرس} 👋\nكل شهر وحضرتك طيب 🌹\n\n📊 تقفيلة شهر {الشهر}\n👥 دفعوا {دفعوا} من {عدد_الطلبة} طالب\n💰 إجمالي المحصّل: {المحصل} ج\n🏢 نصيب السنتر: {نصيب_السنتر} ج\n✅ صافي حضرتك: {صافي_المدرس} ج\n{الاستلام}\n\n📎 التفاصيل كاملة في الصورة\nشكرًا لحضرتك 🙏\n{السنتر}",
  unpaid:"السلام عليكم يا {المدرس} 👋\n📋 الطلبة اللي لسه مادفعوش شهر {الشهر} ({العدد} طالب):\n\n{القايمة}\n\n💰 الإجمالي: {الإجمالي} ج\n{السنتر}",
  receipt:"إيصال دفع — {السنتر}\nالطالب: {الطالب}\nالمجموعة: {المجموعة} مع {المدرس}\nالشهر: {الشهر}\nالمبلغ: {المدفوع} جنيه ✓\nالباقي: {الباقي} جنيه\nرقم الإيصال: {رقم_الإيصال}"};
var TPL_KEYS=["الطالب","المجموعة","المدرس","المادة","الشهر","الاشتراك","المدفوع","الباقي","السنتر","رقم_الإيصال"];
var TPL_KEYS_UNPAID=["المدرس","الشهر","العدد","القايمة","الإجمالي","السنتر"];
function unpaidVars(t,items,m){return{"المدرس":titled(t.name),"الشهر":monthName(m),"العدد":arn(items.length),"القايمة":items.map(e=>`• ${e.s.name} (${e.g.name}) — ${isPart(e.g,e.s,m)?"باقي ":""}${arn(remaining(e.g,e.s,m))} ج`).join("\n"),"الإجمالي":arn(items.reduce((a,e)=>a+remaining(e.g,e.s,m),0)),"السنتر":BRAND.name}}
var TPL_KEYS_CLOSE=["المدرس","الشهر","عدد_الطلبة","دفعوا","المحصل","نصيب_السنتر","صافي_المدرس","الاستلام","المواد","السنتر"];
function titled(n){n=String(n||"").trim();return /^(مستر|مس |ميس|م\s*\/|م\.|م |د\s*\/|د\.|د |دكتور|أ\s*\/|ا\s*\/|أ\.|أستاذ|استاذ|كابتن|شيخ|الشيخ|المهندس|الأستاذ|الاستاذ)/.test(n)?n:"مستر "+n}
function closeVars(t,m){const a=teacherMonth(t,m),P=getPayout(t.id,m);return{"المدرس":titled(t.name),"الشهر":monthName(m),"عدد_الطلبة":arn(a.stu),"دفعوا":arn(a.paid),"المحصل":arn(a.collected),"نصيب_السنتر":arn(a.center),"صافي_المدرس":arn(a.teacher),"الاستلام":P?`💵 استلمت حضرتك ${arn(P.amount)} ج يوم ${fmtDay(P.date)}`:"","المواد":subNames(t)||"","السنتر":BRAND.name}}
function getTpl(k){const v=S.settings&&S.settings.tpl&&S.settings.tpl[k];return (typeof v==="string"&&v.trim())?v:TPL_DEFAULT[k]}
function tplVars(t,g,x,m){return{"الطالب":x.name,"المجموعة":g.name,"المدرس":t.name,"الشهر":monthName(m),"الاشتراك":arn(feeOf(g,x)),"المدفوع":arn(payAmt(g,x,m)),"الباقي":arn(remaining(g,x,m)),"السنتر":BRAND.name,"رقم_الإيصال":receiptNo(g,x,m),"المادة":(t.groups?subOf(t,g).name:"")||""}}
function fillTpl(tpl,v){let out=String(tpl).split("\n").filter(l=>{const q=l.trim().match(/^\{([^{}]+)\}$/);return !(q&&q[1] in v&&v[q[1]]==="")}).join("\n").replace(/\n{3,}/g,"\n\n").replace(/\{([^{}]+)\}/g,(a,k)=>k in v?v[k]:a);
  // drop a "الباقي: ٠ جنيه" line when nothing is left
  return out.split("\n").filter(l=>!(/الباقي/.test(l)&&v["الباقي"]==="٠"&&/^[^{]*الباقي[^0-9٠-٩]*٠[^0-9٠-٩]*$/.test(l))).join("\n")}
function sampleCtx(){for(const t of S.teachers)for(const g of (t.groups||[]))for(const x of activeSt(g))return{t,g,x};return{t:{name:"مستر أحمد"},g:{id:"x",name:"سبت وتلات 3 م",fee:250},x:{id:"y",name:"علي محمد"}}}
function previewVars(k){if(k==="unpaid"){const m=payMonth,l=unpaidList(m);const t=l.length?l[0].t:null;if(t)return unpaidVars(t,l.filter(e=>e.t.id===t.id),m);return{"المدرس":"مستر أحمد","الشهر":monthName(m),"العدد":"٢","القايمة":"• علي محمد (سبت وتلات 3 م) — ٢٥٠ ج\n• منى سعيد (حد وأربع 5 م) — باقي ١٠٠ ج","الإجمالي":"٣٥٠","السنتر":BRAND.name}}
  if(k==="closing"){const t=S.teachers.find(x=>(x.groups||[]).some(g=>activeSt(g).length))||S.teachers[0];if(t)return closeVars(t,payMonth);return{"المدرس":"مستر أحمد","الشهر":monthName(payMonth),"عدد_الطلبة":"٢٥","دفعوا":"٢٠","المحصل":"٥١٠٠","نصيب_السنتر":"١٣٠٠","صافي_المدرس":"٣٨٠٠","الاستلام":"","المواد":"كيمياء","السنتر":BRAND.name}}const c=sampleCtx(),v=tplVars(c.t,c.g,c.x,payMonth);if(k==="reminder"){v["الباقي"]=v["الاشتراك"];v["المدفوع"]="٠"}else{v["المدفوع"]=v["الاشتراك"];v["الباقي"]="٠"}return v}
function viewSettings(){
  const box=(k,title)=>`<section class="form"><h2>${title}</h2>
    <textarea id="tpl-${k}" class="tpl" oninput="tplPreview('${k}')">${esc(getTpl(k))}</textarea>
    <div class="chips">${(k==="closing"?TPL_KEYS_CLOSE:k==="unpaid"?TPL_KEYS_UNPAID:TPL_KEYS).map(n=>`<button type="button" class="chipb" onclick="insertTpl('${k}','{${n}}')">{${n}}</button>`).join("")}</div>
    <div class="lbl">شكلها هيبقى كده (مثال):</div><div class="preview" id="pv-${k}">${esc(fillTpl(getTpl(k),previewVars(k)))}</div>
    <div class="bar"><button class="btn" onclick="saveTpl('${k}')">حفظ</button><button class="btn ghost" onclick="resetTpl('${k}')">رجوع للصيغة الأصلية</button></div></section>`;
  return `<div class="top"><button class="back" onclick="go({view:'home'})" aria-label="رجوع">›</button><div class="t"><h1>صيغة الرسايل</h1><div class="sub">اكتب الرسالة بأسلوبك، والكلام اللي بين { } بيتغير لوحده</div></div></div>
  ${box("reminder","رسالة التذكير بالاشتراك")}${box("receipt","رسالة الإيصال")}${box("unpaid","قايمة اللي مادفعوش للمدرس")}${box("closing","رسالة التقفيلة للمدرس")}`;
}
function tplPreview(k){const el=document.getElementById("pv-"+k),ta=document.getElementById("tpl-"+k);if(el&&ta)el.textContent=fillTpl(ta.value||TPL_DEFAULT[k],previewVars(k))}
function insertTpl(k,tok){const ta=document.getElementById("tpl-"+k);if(!ta)return;const a=ta.selectionStart??ta.value.length,b=ta.selectionEnd??a;ta.value=ta.value.slice(0,a)+tok+ta.value.slice(b);ta.focus();ta.setSelectionRange(a+tok.length,a+tok.length);tplPreview(k)}
function saveTpl(k){const ta=document.getElementById("tpl-"+k);S.settings=S.settings||{};S.settings.tpl=S.settings.tpl||{};const v=ta.value.trim();if(!v||v===TPL_DEFAULT[k])delete S.settings.tpl[k];else S.settings.tpl[k]=v;save();flash("اتحفظت الصيغة ✓");render()}
function resetTpl(k){if(S.settings&&S.settings.tpl)delete S.settings.tpl[k];save();render()}


/* ---------- subjects (a teacher's subjects / school years, each with its own share) ---------- */
var subEdit=null;
function subForm(t,sub){const sh=sub?shareOfSub(sub):{type:"pct",value:0},canDel=sub&&subjectsOf(t).length>1&&!(t.groups||[]).some(g=>g.subjectId===sub.id);
  return `<form class="form subform" onsubmit="saveSubject(event,'${t.id}','${sub?sub.id:""}')">
    <div class="f"><label class="lbl" for="sbName">المادة / السنة الدراسية</label><input id="sbName" required value="${esc(sub?sub.name:"")}" placeholder="كيمياء — تانية ثانوي"></div>
    <div class="f"><label class="lbl" for="sbT">نسبة السنتر</label><div class="bar"><select id="sbT"><option value="pct"${sh.type==="pct"?" selected":""}>نسبة ٪ من المحصّل</option><option value="fixed"${sh.type==="fixed"?" selected":""}>مبلغ على كل طالب دفع</option></select>
      <input id="sbV" type="number" inputmode="numeric" min="0" value="${sh.value||""}" placeholder="40" style="width:100px"></div></div>
    <div class="bar"><button class="btn">${sub?"حفظ":"إضافة"}</button><button type="button" class="btn ghost" onclick="subEdit=null;render()">إلغاء</button>${canDel?`<button type="button" class="x" onclick="delSubject('${t.id}','${sub.id}',this)">حذف المادة</button>`:""}</div>
    ${sub&&!canDel&&subjectsOf(t).length>1?'<div class="sub">عشان تحذف المادة، انقل أو احذف مجاميعها الأول.</div>':""}</form>`}
function saveSubject(e,tid,sid){e.preventDefault();const t=findTeacher(tid);if(!t)return;const ss=subjectsOf(t),name=sbName.value.trim();if(!name)return;
  const share={type:sbT.value,value:Math.max(0,+sbV.value||0)};
  if(sid){const x=ss.find(q=>q.id===sid);if(x){x.name=name;x.share=share}}else ss.push({id:uid(),name,share});
  if(ss.length===1){t.subject=ss[0].name;t.share=ss[0].share}
  subEdit=null;teacherImg=null;save();render()}
function delSubject(tid,sid,btn){twice("sd"+sid,()=>{const t=findTeacher(tid);if(!t)return;t.subjects=subjectsOf(t).filter(x=>x.id!==sid);subEdit=null;save();render()},btn)}
function mergeTeachers(tid){const t=findTeacher(tid);if(!t)return;const ids=[...document.querySelectorAll('input[name=mg]:checked')].map(i=>i.value);if(!ids.length){alertBox("اختار المدرس اللي عايز تدمجه");return}
  const others=ids.map(findTeacher).filter(Boolean);
  if([t,...others].some(x=>Object.keys(S.locks||{}).some(k=>k.startsWith(x.id+"|")))){alertBox("فيه شهر مقفول عند واحد منهم. افتح الشهور المقفولة الأول، وبعدين ادمج.");return}
  subjectsOf(t);
  others.forEach(o=>{const oss=subjectsOf(o);t.subjects.push(...oss);t.groups=(t.groups||[]).concat(o.groups||[]);if(!t.phone&&o.phone)t.phone=o.phone;
    Object.keys(S.payouts||{}).forEach(k=>{if(!k.startsWith(o.id+"|"))return;const m=k.slice(o.id.length+1),P=S.payouts[k],nk=t.id+"|"+m,Q=S.payouts[nk];
      S.payouts[nk]=Q?{amount:(+Q.amount||0)+(+P.amount||0),date:(Q.date>P.date?Q.date:P.date)}:P;delete S.payouts[k]});
    S.teachers=S.teachers.filter(x=>x.id!==o.id)});
  teacherImg=null;save();go({view:"teacher",tid:t.id})}

/* ---------- actions ---------- */
function addTeacher(e){e.preventDefault();const share={type:tShT.value,value:+tShV.value||0},t={id:uid(),name:tName.value.trim(),subject:tSub.value.trim(),phone:tPhone.value.trim(),share,subjects:[{id:uid(),name:tSub.value.trim(),share}],groups:[]};S.teachers.push(t);save();go({view:"teacher",tid:t.id})}
function addGroup(e){e.preventDefault();const t=findTeacher(nav.tid);
  const days=[...document.querySelectorAll('input[name=d]:checked')].map(i=>+i.value);
  if(!days.length){alertBox("اختار يوم واحد على الأقل");return}
  const sel=document.getElementById("gSub"),g={id:uid(),days,time:gTime.value,fee:+gFee.value||0,students:[],subjectId:(sel&&sel.value)||nav.sub||subjectsOf(t)[0].id};
  g.name=gName.value.trim()||(days.map(d=>DAYS[d]).join(" و ")+" "+fmtTime(g.time));
  t.groups=t.groups||[];t.groups.push(g);save();go({view:"teacher",tid:t.id})}
function alertBox(m){const n=document.createElement("div");n.className="note";n.textContent=m;document.querySelector(".form").prepend(n)}
var confirmKey=null;
function twice(key,fn,btn){if(confirmKey===key){confirmKey=null;fn()}else{confirmKey=key;btn.textContent="اضغط تاني للتأكيد";setTimeout(()=>{if(confirmKey===key){confirmKey=null;render()}},3000)}}
function delTeacher(id){twice("t"+id,()=>{S.teachers=S.teachers.filter(t=>t.id!==id);save();go({view:"home"})},event.target)}
function delGroup(){const{t,g}=findGroup(nav.gid);twice("g"+g.id,()=>{t.groups=t.groups.filter(x=>x.id!==g.id);save();go({view:"teacher",tid:t.id})},event.target)}
function addStu(e){e.preventDefault();const{g}=findGroup(nav.gid);g.students=g.students||[];
  g.students.push({id:uid(),name:newStu.value.trim(),mobile:newMobile.value.trim(),phone:newPhone.value.trim(),joined:curMonth()});save();render();document.getElementById("newStu").focus()}
function delStu(sid){const{t,g}=findGroup(nav.gid);twice("s"+sid,()=>{const x=(g.students||[]).find(y=>y.id===sid);if(!x)return;const m0=curMonth(),pre=g.id+"|";let history=false;if(isLocked(t.id,m0)&&hasPay(g,x,m0)){flash("الطالب دافع في شهر مقفول. افتح الشهر الأول.");render();return}
  Object.keys(S.payments).forEach(k=>{if(!k.startsWith(pre))return;const rec=S.payments[k];if(!rec||!hasPayV(rec[sid]))return;if(k.slice(pre.length)<m0)history=true;else delete rec[sid]});
  if(history||wasBefore(g,x,m0))x.left=m0;else g.students=g.students.filter(y=>y.id!==sid);save();render()},event.target)}
function setAtt(sid,v){const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};S.attendance[k][sid]=S.attendance[k][sid]===v?"":v;save();render()}
function markAll(v){const{g}=findGroup(nav.gid);const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};(g.students||[]).forEach(s=>S.attendance[k][s.id]=v);save();render()}
function togPay(sid){const f=findGroup(nav.gid);const x=f&&(f.g.students||[]).find(y=>y.id===sid);if(!x)return;partEdit=null;if(setPaid(f.g,x,payMonth,!isPaid(f.g,x,payMonth)))save();render()}
var partEdit=null;
function savePart(e,gid,sid){e.preventDefault();const f=findGroup(gid);const x=f&&(f.g.students||[]).find(y=>y.id===sid);if(!x)return;const m=nav.view==="student"?curMonth():payMonth;if(setPart(f.g,x,m,document.getElementById("partAmt").value))save();partEdit=null;render()}
</script>
