<title>سنتر المهندس 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, drill-down — logo band → today strip → teachers → groups → group sheet. Brand: El-Mohandes 2 — black, white, red */
:root{
  --bg:#0B0B0C; --card:#161618; --ink:#F4F4F5; --muted:#A0A0A8; --line:#2A2A2E;
  --accent:#E0262F; --accent-soft:#3A1416; --plum:#FF5A5F;
  --ok:#3FCB7E; --ok-soft:#14301F; --bad:#FF5A5F; --bad-soft:#3A1416; --warn:#F0B44C;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:1rem}
.top{display:flex;align-items:center;gap:10px}
.top .t{flex:1;min-width:0}
.sub{color:var(--muted);font-size:.85rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{border:1px solid var(--line);background:var(--card);border-radius:10px;width:40px;height:40px;font-size:1.2rem;flex:none}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.lbl{font-size:.75rem;letter-spacing:.02em;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:right;width:100%}
.row .m{flex:1;min-width:0}
.avatar{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;flex:none}
.chev{color:var(--muted)}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.now{background:var(--plum);color:#fff}
.today{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.today .row{border:0;background:var(--bg);padding:10px 12px}
.slot{font-family:var(--display);font-weight:700;color:var(--plum);font-variant-numeric:tabular-nums;min-width:54px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stu{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stu .m{flex:1;min-width:0}
.tog{display:flex;gap:6px}
.tog button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-weight:600;font-size:.85rem}
.tog .p[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tog .a[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tog .paid[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.x{border:0;background:transparent;color:var(--bad);font-size:.85rem}
.form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form .f{display:flex;flex-direction:column;gap:4px}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:.85rem;cursor:pointer}
.days input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.days label{position:relative}
.days label:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:24px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px}
.note{font-size:.8rem;color:var(--warn)}
.num{font-variant-numeric:tabular-nums}
.hist{display:flex;gap:3px;flex-wrap:wrap}
.hist i{width:9px;height:9px;border-radius:3px;background:var(--line)}
.hist i.p{background:var(--ok)} .hist i.a{background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.row,.stu{transition:transform .12s}.row:active{transform:scale(.99)}}
</style>

const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

function todayISO(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTime(t){if(!t)return"";let[h,m]=t.split(":").map(Number);const pm=h>=12;h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+(pm?" م":" ص")}
function daysTxt(g){return g.days.map(d=>DAYS[d]).join(" و ")}
function findTeacher(id){return S.teachers.find(t=>t.id===id)}
function findGroup(gid){for(const t of S.teachers){const g=(t.groups||[]).find(g=>g.id===gid);if(g)return{t,g}}return null}

function arn(n){return Number(n||0).toLocaleString("ar-EG")}
function shareOf(t){const s=(t&&t.share)||{};return{type:s.type==="fixed"?"fixed":"pct",value:+s.value||0}}
function shareTxt(t){const s=shareOf(t);if(!s.value)return "مفيش نسبة للسنتر";return s.type==="fixed"?arn(s.value)+" ج على كل طالب دفع":arn(s.value)+"٪ من المحصّل"}
function cutFor(t,paid,collected){const s=shareOf(t);const c=s.type==="fixed"?paid*s.value:Math.round(collected*s.value/100);return Math.max(0,Math.min(c,collected))}
function teacherMonth(t,m){let stu=0,paid=0,collected=0;(t.groups||[]).forEach(g=>{const pr=S.payments[g.id+"|"+m]||{};const n=(g.students||[]).length,p=(g.students||[]).filter(s=>pr[s.id]).length;stu+=n;paid+=p;collected+=p*(+g.fee||0)});const center=cutFor(t,paid,collected);return{stu,paid,collected,center,teacher:collected-center}}
function saveShare(tid){const t=findTeacher(tid);if(!t)return;t.share={type:document.getElementById("shT").value,value:+document.getElementById("shV").value||0};teacherImg=null;save();render()}
function accountsBox(t){
  const a=teacherMonth(t,payMonth),s=shareOf(t);
  return `<section class="form"><div class="bar" style="justify-content:space-between"><h2>حساب الشهر</h2>
    <span class="bar"><label class="lbl" for="acMonth">الشهر</label><input type="month" id="acMonth" value="${payMonth}" onchange="payMonth=this.value;teacherImg=null;render()"></span></div>
    <div class="stats"><div class="stat"><b class="num">${arn(a.collected)}</b><span class="sub">المحصّل (ج)</span></div>
    <div class="stat"><b class="num" style="color:var(--accent)">${arn(a.center)}</b><span class="sub">نصيب السنتر</span></div>
    <div class="stat"><b class="num" style="color:var(--ok)">${arn(a.teacher)}</b><span class="sub">نصيب المدرس</span></div></div>
    <div class="sub">دفع ${arn(a.paid)} من ${arn(a.stu)} طالب · نسبة السنتر: ${shareTxt(t)}</div>
    <div class="bar"><label class="lbl" for="shT">نسبة السنتر</label>
      <select id="shT"><option value="pct"${s.type==="pct"?" selected":""}>نسبة ٪ من المحصّل</option><option value="fixed"${s.type==="fixed"?" selected":""}>مبلغ ثابت على الطالب</option></select>
      <input id="shV" type="number" inputmode="numeric" min="0" value="${s.value||""}" placeholder="40" style="width:90px">
      <button class="btn ghost" onclick="saveShare('${t.id}')">حفظ</button></div>
    <div class="sub">المبلغ الثابت بيتحسب على الطلاب اللي دفعوا بس.</div>
  </section>`;
}

  try{
    const docs=splitState(),batch=fsdb.batch();let n=0;

  catch(e){authState="login";authErr="مش قادر أوصل للنت. اتأكد إن النت شغال وافتح البرنامج تاني.";render();return}
  firebase.initializeApp(FIREBASE_CONFIG);
  fauth=firebase.auth();fsdb=firebase.firestore();
  try{await fsdb.enablePersistence({synchronizeTabs:true})}catch(e){}
  fauth.onAuthStateChanged(async u=>{

function subscribe(){
  const base=fsdb.collection("centers").doc(cuser.uid);
  let core=null,months={};
  const apply=()=>{if(dirty||saving)return;
    const pay={};for(const m in months)Object.assign(pay,months[m]);
    S={teachers:(core&&core.teachers)||S.teachers||[],attendance:{},payments:core||Object.keys(months).length?pay:(S.payments||{})};
    lastWritten=splitState();
    try{localStorage.setItem(lsKey(),JSON.stringify(S))}catch(e){}
    render()};
  unsubs.push(base.onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;core=sn.exists?sn.data():{teachers:[]};offline=false;apply()},e=>{offline=true;if(e&&e.code==="permission-denied")authState="blocked";render()}));
  unsubs.push(base.collection("months").onSnapshot(sn=>{if(sn.metadata.hasPendingWrites)return;const m={};sn.docs.forEach(d=>m[d.id]=(d.data().payments||{}));months=m;apply()},()=>{offline=true;render()}));
}

  restorePending={teachers:d.teachers,attendance:d.attendance||{},payments:d.payments||{}};
  const when=j.savedAt?new Date(j.savedAt).toLocaleString("ar-EG",{day:"numeric",month:"long",hour:"numeric",minute:"2-digit"}):"";
  backupMsg="";render();
  document.querySelector(".form").insertAdjacentHTML("beforeend",`<div class="note">النسخة دي${when?" بتاريخ "+esc(when):""} وفيها ${restorePending.teachers.length} مدرس. الاسترجاع هيمسح البيانات الحالية ويحط مكانها بيانات النسخة.</div>
    <div class="bar"><button class="btn" style="background:var(--bad)" onclick="confirmRestore()">أيوه، استرجع</button><button class="btn ghost" onclick="restorePending=null;render()">إلغاء</button></div>`);
}
async function restoreBackup(inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  backupMsg="جاري قراءة النسخة…";render();
  try{
    if(/image\//.test(f.type)||/\.(png|jpe?g|heic)$/i.test(f.name)){offerRestore(await decodeBackupPNG(f))}
    else{offerRestore(JSON.parse(await f.text()))}
  }catch(e){backupMsg=/image\//.test(f.type)?"الصورة دي مش نسخة سليمة. لازم تكون صورة النسخة الأصلية من غير قص أو ضغط (لو جت من الواتساب لازم تكون اتبعتت كمستند).":"الملف ده مش نسخة احتياطية من البرنامج.";render()}
}
function confirmRestore(){if(!restorePending)return;S=restorePending;restorePending=null;save();backupMsg="اترجعت البيانات من النسخة.";render()}

/* ---------- actions ---------- */
function addTeacher(e){e.preventDefault();const t={id:uid(),name:tName.value.trim(),subject:tSub.value.trim(),share:{type:tShT.value,value:+tShV.value||0},groups:[]};S.teachers.push(t);save();go({view:"teacher",tid:t.id})}
function addGroup(e){e.preventDefault();const t=findTeacher(nav.tid);
  const days=[...document.querySelectorAll('input[name=d]:checked')].map(i=>+i.value);
  if(!days.length){alertBox("اختار يوم واحد على الأقل");return}
  const g={id:uid(),days,time:gTime.value,fee:+gFee.value||0,students:[]};
  g.name=gName.value.trim()||(days.map(d=>DAYS[d]).join(" و ")+" "+fmtTime(g.time));
  t.groups=t.groups||[];t.groups.push(g);save();go({view:"teacher",tid:t.id})}
function alertBox(m){const n=document.createElement("div");n.className="note";n.textContent=m;document.querySelector(".form").prepend(n)}
var confirmKey=null;
function twice(key,fn,btn){if(confirmKey===key){confirmKey=null;fn()}else{confirmKey=key;btn.textContent="اضغط تاني للتأكيد";setTimeout(()=>{if(confirmKey===key){confirmKey=null;render()}},3000)}}
function delTeacher(id){twice("t"+id,()=>{S.teachers=S.teachers.filter(t=>t.id!==id);save();go({view:"home"})},event.target)}
function delGroup(){const{t,g}=findGroup(nav.gid);twice("g"+g.id,()=>{t.groups=t.groups.filter(x=>x.id!==g.id);save();go({view:"teacher",tid:t.id})},event.target)}
function addStu(e){e.preventDefault();const{g}=findGroup(nav.gid);g.students=g.students||[];
  g.students.push({id:uid(),name:newStu.value.trim(),phone:newPhone.value.trim()});save();render();document.getElementById("newStu").focus()}
function delStu(sid){const{g}=findGroup(nav.gid);twice("s"+sid,()=>{g.students=g.students.filter(s=>s.id!==sid);save();render()},event.target)}
function setAtt(sid,v){const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};S.attendance[k][sid]=S.attendance[k][sid]===v?"":v;save();render()}
function markAll(v){const{g}=findGroup(nav.gid);const k=nav.gid+"|"+attDate;S.attendance[k]=S.attendance[k]||{};(g.students||[]).forEach(s=>S.attendance[k][s.id]=v);save();render()}
function togPay(sid){const k=nav.gid+"|"+payMonth;S.payments[k]=S.payments[k]||{};S.payments[k][sid]=!S.payments[k][sid];save();render()}
</script>
